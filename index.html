<!DOCTYPE html>
<html>
<head>
    <title>YouTube → MP3 → Catbox</title>
</head>
<body>
    <h1>YouTube → MP3 → Catbox</h1>
    <input id="urlInput" type="text" placeholder="Вставьте ссылку на YouTube" size="50">
    <button onclick="process()">Конвертировать</button>
    <div id="result"></div>

    <script>
        async function process() {
            const url = document.getElementById('urlInput').value;
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Загрузка...';

            try {
                const apiUrl = `https://yt2mp3-catbox.onrender.com/download?url=${encodeURIComponent(url)}`;
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (!data.link) throw new Error('Не удалось получить MP3');

                const directLink = data.link;
                resultDiv.innerHTML = `✅ Готовая ссылка: <a href="${directLink}" target="_blank">${directLink}</a>`;
            } catch (err) {
                resultDiv.textContent = '❌ Ошибка: ' + err.message;
            }
        }
    </script>
</body>
</html>
