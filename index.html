<!DOCTYPE html>
<html>
<head>
    <title>YouTube → MP3 → Catbox</title>
</head>
<body>
    <h1>YouTube → MP3 → Catbox</h1>
    <input id="urlInput" type="text" placeholder="Вставьте ссылку на YouTube" size="50">
    <button onclick="process()">Конвертировать</button>
    <div id="result"></div>

    <script>
        async function process() {
            const url = document.getElementById('urlInput').value;
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Загрузка...';

            try {
                const apiUrl = `https://api.vevioz.com/api/button/mp3/${encodeURIComponent(url)}`;
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (!data.download) throw new Error('Не удалось получить MP3');

                const mp3Url = data.download;
                const blob = await fetch(mp3Url).then(r => r.blob());
                const formData = new FormData();
                formData.append('reqtype', 'fileupload');
                formData.append('fileToUpload', blob, 'audio.mp3');

                const uploadRes = await fetch('https://catbox.moe/user/api.php', {
                    method: 'POST',
                    body: formData
                });
                const directLink = await uploadRes.text();

                resultDiv.innerHTML = `✅ Готовая ссылка: <a href="${directLink}" target="_blank">${directLink}</a>`;
            } catch (err) {
                resultDiv.textContent = '❌ Ошибка: ' + err.message;
            }
        }
    </script>
</body>
</html>
