<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Link</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { overflow-x: hidden; }

        body {
            min-height: 100vh;
            background-color: #ff1464;
            background-image:
                repeating-linear-gradient(0deg, #e01158 0 1px, transparent 1px 40px),
                repeating-linear-gradient(90deg, #e01158 0 1px, transparent 1px 40px),
                radial-gradient(circle at 10px 10px, #ff4d8a 3px, transparent 4px);
            background-size: 40px 40px, 40px 40px, 40px 40px;
            font-family: Verdana, Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px 16px;
        }

        .page {
            max-width: 620px;
            width: 100%;
        }

        .chrome-sub {
            text-align: center;
            color: #fff;
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 26px;
            text-transform: uppercase;
            margin-top: 10px;
        }

        hr.thin {
            border: none;
            height: 1px;
            background: #b30d45;
            box-shadow: 0 1px 0 #ff6fa3;
            margin: 18px 0;
        }

        .converter-box {
            max-width: 420px;
            margin: 24px auto;
            background: #d8d8d8;
            border: 2px outset #fff;
            padding: 18px;
        }
        .converter-box .title {
            text-align: center;
            font-weight: bold;
            color: #003399;
            background: linear-gradient(180deg, #fff, #b8c8e8);
            border: 1px solid #6699cc;
            padding: 4px;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .input-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .input-group input {
            flex: 1;
            min-width: 180px;
            padding: 5px 7px;
            border: 1px inset #808080;
            font-size: 12px;
            font-family: Verdana, sans-serif;
        }
        .input-group button {
            padding: 5px 16px;
            border: 1px outset #d4d0c8;
            background: #d4d0c8;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .input-group button:active { border-style: inset; }

        #result {
            margin-top: 10px;
            padding: 8px 10px;
            background: #000;
            color: #0f0;
            font-family: "Courier New", monospace;
            font-size: 12px;
            word-break: break-all;
            min-height: 36px;
            border: 1px inset #808080;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }
        #result a { color: #0ff; }
        .copy-btn {
            border: 1px outset #d4d0c8;
            background: #d4d0c8;
            padding: 3px 10px;
            font-size: 11px;
            cursor: pointer;
        }
        .copy-btn:active { border-style: inset; }
        .copy-btn.copied { background: #90ee90; }
        .loading { color: #cc7a00; }

        .linklist {
            list-style: none;
            font-size: 13px;
            margin: 16px 0;
        }
        .linklist li {
            padding: 4px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .linklist .globe {
            width: 14px; height: 14px;
            border-radius: 50%;
            background: conic-gradient(#2a7, #274 25%, #2a7 50%, #274 75%, #2a7);
            border: 1px solid #143;
            flex-shrink: 0;
        }
        .linklist a { color: #fff; text-decoration: underline; }
        .linklist a:visited { color: #ffd6e6; }

        .footer {
            text-align: center;
            font-size: 11px;
            color: #ffd6e6;
            margin-top: 26px;
            border-top: 1px solid #e01158;
            padding-top: 10px;
        }
        .footer a { color: #fff; }
    </style>
</head>
<body>
<div class="page">

    <div class="chrome-sub">youtube → mp3 direct link</div>

    <hr class="thin">

    <div class="converter-box">
        <div class="title">★ вставь ссылку на YouTube ★</div>
        <div class="input-group">
            <input id="urlInput" type="text" placeholder="ссылка на YouTube" spellcheck="false">
            <button onclick="process()">Enter</button>
        </div>
        <div id="result">
            <span class="link">&gt; ожидание ссылки...</span>
        </div>
    </div>

    <hr class="thin">

    <ul class="linklist">
        <li><span class="globe"></span> <a href="#">вставь ссылку на YouTube</a></li>
        <li><span class="globe"></span> <a href="#">получи прямую ссылку на mp3</a></li>
        <li><span class="globe"></span> <a href="#">файл хранится на catbox.moe навсегда</a></li>
    </ul>

    <div class="footer">
        Copyright © 2026, lekomi's page
    </div>

</div>

<script>
    document.getElementById('urlInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') process();
    });

    async function process() {
        const urlInput = document.getElementById('urlInput');
        const resultDiv = document.getElementById('result');
        const url = urlInput.value.trim();

        if (!url) {
            resultDiv.innerHTML = '<span class="link">⚠️ вставь ссылку на YouTube</span>';
            return;
        }

        resultDiv.innerHTML = '<span class="link loading">⏳ секунду...</span>';

        try {
            const apiUrl = `https://yt2mp3-catbox.onrender.com/download?url=${encodeURIComponent(url)}`;
            const response = await fetch(apiUrl);
            const data = await response.json();

            if (data.link) {
                resultDiv.innerHTML = `
                    <span class="link">✅ <a href="${data.link}" target="_blank">${data.link}</a></span>
                    <button class="copy-btn" onclick="copyLink('${data.link}')">копировать</button>
                `;
            } else {
                resultDiv.innerHTML = '<span class="link">❌ ошибка: ' + (data.error || 'неизвестная проблема') + '</span>';
            }
        } catch (err) {
            resultDiv.innerHTML = '<span class="link">❌ ошибка: ' + err.message + '</span>';
        }
    }

    function copyLink(link) {
        navigator.clipboard.writeText(link).then(() => {
            const btn = document.querySelector('.copy-btn');
            if (btn) {
                btn.textContent = '✅ скопировано';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'копировать';
                    btn.classList.remove('copied');
                }, 2500);
            }
        }).catch(() => {
            alert('не удалось скопировать, скопируйте вручную');
        });
    }
</script>
</body>
</html>
