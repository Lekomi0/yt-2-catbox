<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube → MP3</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0f0f0f;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #1e1e1e;
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 560px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            border: 1px solid #2a2a2a;
        }
        h1 {
            color: #fff;
            font-weight: 600;
            font-size: 28px;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        h1 span {
            color: #ff3b3b;
        }
        .sub {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 24px;
            border-left: 3px solid #ff3b3b;
            padding-left: 12px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .input-group input {
            flex: 1;
            min-width: 200px;
            padding: 14px 18px;
            border-radius: 40px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }
        .input-group input:focus {
            border-color: #ff3b3b;
            background: #222;
        }
        .input-group input::placeholder {
            color: #777;
        }
        .input-group button {
            padding: 14px 28px;
            border-radius: 40px;
            border: none;
            background: #ff3b3b;
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .input-group button:hover {
            background: #e03030;
            transform: scale(0.97);
        }
        .input-group button:active {
            transform: scale(0.94);
        }
        #result {
            margin-top: 20px;
            padding: 16px 18px;
            border-radius: 16px;
            background: #151515;
            color: #ccc;
            font-size: 14px;
            word-break: break-all;
            min-height: 60px;
            border: 1px solid #2a2a2a;
            transition: 0.3s;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }
        #result .link {
            flex: 1;
            min-width: 150px;
        }
        #result a {
            color: #ff6b6b;
            text-decoration: none;
            font-weight: 500;
        }
        #result a:hover {
            text-decoration: underline;
        }
        .copy-btn {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #ddd;
            padding: 6px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
            white-space: nowrap;
        }
        .copy-btn:hover {
            background: #3a3a3a;
            border-color: #666;
        }
        .copy-btn.copied {
            background: #2a5a2a;
            border-color: #4a8a4a;
            color: #8f8;
        }
        .loading {
            color: #ffaa33;
            font-weight: 400;
        }
        .footer-note {
            margin-top: 28px;
            color: #555;
            font-size: 12px;
            text-align: center;
            border-top: 1px solid #2a2a2a;
            padding-top: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎵 YouTube → <span>MP3</span></h1>
        <div class="sub">Конвертер видео в аудио · 320 kbps · бесплатно</div>

        <div class="input-group">
            <input id="urlInput" type="text" placeholder="Вставьте ссылку на YouTube" spellcheck="false">
            <button onclick="process()">Получить ссылку</button>
        </div>

        <div id="result">
            <span class="link">Вставьте ссылку и нажмите «Получить ссылку»</span>
        </div>

        <div class="footer-note">
            Любая ссылка с YouTube → прямая ссылка на MP3<br>
            Файл хранится на catbox.moe · ссылка действует постоянно
        </div>
    </div>

    <script>
        document.getElementById('urlInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') process();
        });

        async function process() {
            const urlInput = document.getElementById('urlInput');
            const resultDiv = document.getElementById('result');
            const url = urlInput.value.trim();

            if (!url) {
                resultDiv.innerHTML = '<span class="link">⚠️ Вставьте ссылку на YouTube</span>';
                return;
            }

            resultDiv.innerHTML = '<span class="link loading">⏳ Конвертация… это может занять 15–30 секунд</span>';

            try {
                const apiUrl = `https://yt2mp3-catbox.onrender.com/download?url=${encodeURIComponent(url)}`;
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.link) {
                    resultDiv.innerHTML = `
                        <span class="link">✅ <a href="${data.link}" target="_blank">${data.link}</a></span>
                        <button class="copy-btn" onclick="copyLink('${data.link}')">📋 Копировать</button>
                    `;
                } else {
                    resultDiv.innerHTML = '<span class="link">❌ Ошибка: ' + (data.error || 'неизвестная проблема') + '</span>';
                }
            } catch (err) {
                resultDiv.innerHTML = '<span class="link">❌ Ошибка: ' + err.message + '</span>';
            }
        }

        function copyLink(link) {
            navigator.clipboard.writeText(link).then(() => {
                const btn = document.querySelector('.copy-btn');
                if (btn) {
                    btn.textContent = '✅ Скопировано';
                    btn.classList.add('copied');
                    setTimeout(() => {
                        btn.textContent = '📋 Копировать';
                        btn.classList.remove('copied');
                    }, 2500);
                }
            }).catch(() => {
                alert('Не удалось скопировать, скопируйте вручную');
            });
        }
    </script>
</body>
</html>
